<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro de Ponto</title>
  <style>
    :root {
      --primary: #af09fc;
      --primary-hover: #7919a5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; }
    
    .card { background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; border: 1px solid var(--border); }
    h2 { margin-bottom: 16px; color: #0f172a; }
    h3 { margin-bottom: 10px; color: #334155; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    
    button { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
    button:hover { background: var(--primary-hover); }
    
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    
    .hidden { display: none; }
    .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>

<div class="container">

  <!-- TELA DE LOGIN -->
  <div id="loginSection" class="card">
    <h2>Acesso ao Sistema</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" required placeholder="admin@admin.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginSenha" required placeholder="123456">
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="appSection" class="hidden">
    <div class="nav-bar card">
      <div>
        <strong id="userNome">--</strong> 
        <span id="userBadge" class="badge">--</span>
      </div>
      <button onclick="logout()" class="btn-secondary" style="width: auto;">Sair</button>
    </div>

    <!-- MÓDULO: REGISTRO DE PONTO -->
    <div class="card">
      <h2>Registrar Ponto</h2>
      <p id="clock" style="font-size: 24px; font-weight: bold; margin-bottom: 12px; color: var(--primary);"></p>
      <div class="btn-grid">
        <button onclick="baterPonto('Entrada')">Entrada</button>
        <button onclick="baterPonto('Saída Almoço')">Saída Almoço</button>
        <button onclick="baterPonto('Retorno Almoço')">Retorno Almoço</button>
        <button onclick="baterPonto('Saída')">Saída</button>
      </div>
    </div>

    <!-- MÓDULO: SOLICITAR FOLGA -->
    <div class="card">
      <h2>Solicitar Folga / Atestado</h2>
      <form id="folgaForm">
        <div class="form-group">
          <label>Data da Folga</label>
          <input type="date" id="folgaData" required>
        </div>
        <div class="form-group">
          <label>Motivo / Justificativa</label>
          <textarea id="folgaMotivo" rows="2" required placeholder="Ex: Consulta médica, folga compensatória..."></textarea>
        </div>
        <button type="submit" class="btn-secondary">Enviar Solicitação</button>
      </form>
    </div>

    <!-- MÓDULO: GERENTE (CADASTRO DE USUÁRIOS) -->
    <div id="adminSection" class="card hidden">
      <h2>Painel do Gerente: Cadastrar Colaborador</h2>
      <form id="cadastroForm">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="cadNome" required>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="cadEmail" required>
        </div>
        <div class="form-group">
          <label>Senha Inicial</label>
          <input type="password" id="cadSenha" required>
        </div>
        <div class="form-group">
          <label>Função / Nível de Acesso</label>
          <select id="cadFuncao">
            <option value="user">Colaborador (Normal)</option>
            <option value="admin">Gerente / RH</option>
          </select>
        </div>
        <button type="submit">Cadastrar Usuário</button>
      </form>
    </div>

    <!-- MÓDULO: RELATÓRIOS E HISTÓRICO -->
    <div class="card">
      <h2>Histórico e Relatórios</h2>
      <button onclick="carregarHistorico()" class="btn-secondary" style="margin-bottom: 12px;">Atualizar Dados</button>
      
      <h3>Pontos Registrados</h3>
      <table id="tabelaPontos">
        <thead>
          <tr><th>Nome</th><th>Data e Hora</th><th>Tipo</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3 style="margin-top: 20px;">Solicitações de Folgas</h3>
      <table id="tabelaFolgas">
        <thead>
          <tr><th>Nome</th><th>Data</th><th>Motivo</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // COLE A URL GERADA NA IMPLANTAÇÃO DENTRO DAS ASPAS ABAIXO:
  const API_URL = "https://script.google.com/macros/s/AKfycbz3w8odF2W-EfAHZ80niPR658nKPWrqyerigzxiWLHiyZmjebctKOC67I61FYabf1ei/exec"; 

  let currentUser = null;

  // Relógio Digital
  setInterval(() => {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('pt-BR');
  }, 1000);

  // Requisição Fetch
  async function apiCall(data) {
    if (!API_URL || API_URL === "SUA_URL_DO_APPS_SCRIPT_AQUI") {
      alert("Insira a URL do Apps Script na variável API_URL do arquivo HTML.");
      return;
    }
    
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(data)
      });
      return await response.json();
    } catch (err) {
      alert("Falha na comunicação com o backend. Verifique a URL e as permissões de acesso do Apps Script.");
      console.error(err);
    }
  }

  // Action: Login
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const senha = document.getElementById("loginSenha").value;

    const res = await apiCall({ action: "login", email, senha });

    if (res && res.status === "sucesso") {
      currentUser = res.user;
      iniciarSessao();
    } else {
      alert(res ? res.message : "Erro na autenticação.");
    }
  });

  function iniciarSessao() {
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("appSection").classList.remove("hidden");
    document.getElementById("userNome").innerText = currentUser.nome;
    document.getElementById("userBadge").innerText = currentUser.funcao === "admin" ? "Gerente" : "Colaborador";

    if (currentUser.funcao === "admin") {
      document.getElementById("adminSection").classList.remove("hidden");
    }

    carregarHistorico();
  }

  function logout() {
    currentUser = null;
    location.reload();
  }

  // Action: Registrar Ponto
  async function baterPonto(tipo) {
    if (!confirm(`Confirmar registro de ponto: ${tipo}?`)) return;

    const res = await apiCall({
      action: "registrarPonto",
      id_usuario: currentUser.id,
      nome: currentUser.nome,
      tipo: tipo
    });

    if (res) alert(res.message);
    carregarHistorico();
  }

  // Action: Solicitar Folga
  document.getElementById("folgaForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = document.getElementById("folgaData").value;
    const motivo = document.getElementById("folgaMotivo").value;

    const res = await apiCall({
      action: "solicitarFolga",
      id_usuario: currentUser.id,
      nome: currentUser.nome,
      data,
      motivo
    });

    if (res) alert(res.message);
    document.getElementById("folgaForm").reset();
    carregarHistorico();
  });

  // Action: Cadastrar Usuário
  document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("cadNome").value;
    const email = document.getElementById("cadEmail").value;
    const senha = document.getElementById("cadSenha").value;
    const funcao = document.getElementById("cadFuncao").value;

    const res = await apiCall({
      action: "cadastrarUsuario",
      nome, email, senha, funcao
    });

    if (res) alert(res.message);
    if (res && res.status === "sucesso") {
      document.getElementById("cadastroForm").reset();
    }
  });

  // Action: Carregar Histórico
  async function carregarHistorico() {
    const res = await apiCall({
      action: "obterHistorico",
      id_usuario: currentUser.id,
      funcao: currentUser.funcao
    });

    if (res && res.status === "sucesso") {
      const tbodyPontos = document.querySelector("#tabelaPontos tbody");
      tbodyPontos.innerHTML = res.pontos.map(p => 
        `<tr><td>${p.nome}</td><td>${p.dataHora}</td><td>${p.tipo}</td></tr>`
      ).join('');

      const tbodyFolgas = document.querySelector("#tabelaFolgas tbody");
      tbodyFolgas.innerHTML = res.folgas.map(f => 
        `<tr><td>${f.nome}</td><td>${f.data}</td><td>${f.motivo}</td><td>${f.status}</td></tr>`
      ).join('');
    }
  }
</script>

</body>
</html>
