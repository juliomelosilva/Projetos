<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Controle de Ponto e Banco de Horas</title>
  <style>
    /* Estilos do seu layout original mantidos */
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .nav-tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: none; font-size: 16px; }
    .tab-btn.active { border-bottom: 3px solid #007bff; font-weight: bold; color: #007bff; }
    .tab-content { display: none; background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
    button.btn-submit { background: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; }
    th { background-color: #f8f9fa; }
  </style>
</head>
<body>

  <!-- Menu de Navegação Mantido + Nova Aba Viagem -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('ponto')">Ponto</button>
    <button class="tab-btn" onclick="openTab('atestado')">Atestados</button>
    <button class="tab-btn" onclick="openTab('folga')">Folgas</button>
    <button class="tab-btn" onclick="openTab('viagem')">Viagem</button> <!-- Nova Aba -->
    <button class="tab-btn" onclick="openTab('historico')">Histórico</button>
  </div>

  <!-- ABA: PONTO -->
  <div id="ponto" class="tab-content active">
    <h2>Registro de Ponto</h2>
    <form id="formPonto">
      <div class="form-group">
        <label>Colaborador ID:</label>
        <input type="number" id="pontoColabId" value="1" required>
      </div>
      <div class="form-group">
        <label>Entrada (Padrão 08:00):</label>
        <input type="datetime-local" id="pontoEntrada" required>
      </div>
      <div class="form-group">
        <label>Início Almoço:</label>
        <input type="datetime-local" id="pontoInicioAlmoco">
      </div>
      <div class="form-group">
        <label>Fim Almoço:</label>
        <input type="datetime-local" id="pontoFimAlmoco">
      </div>
      <div class="form-group">
        <label>Saída:</label>
        <input type="datetime-local" id="pontoSaida" required>
      </div>
      <button type="submit" class="btn-submit">Registrar Ponto</button>
    </form>
  </div>

  <!-- ABA: ATESTADO -->
  <div id="atestado" class="tab-content">
    <h2>Lançar Atestado</h2>
    <form id="formAtestado">
      <div class="form-group">
        <label>Colaborador ID:</label>
        <input type="number" id="atestadoColabId" value="1" required>
      </div>
      <div class="form-group">
        <label>Minutos Abonados (Ex: 480 para 8h):</label>
        <input type="number" id="atestadoMinutos" value="480" required>
      </div>
      <div class="form-group">
        <label>Comprovante (Anexo):</label>
        <input type="file" id="atestadoFile">
      </div>
      <button type="submit" class="btn-submit">Registrar Atestado</button>
    </form>
  </div>

  <!-- ABA: FOLGA -->
  <div id="folga" class="tab-content">
    <h2>Lançar Folga</h2>
    <form id="formFolga">
      <div class="form-group">
        <label>Colaborador ID:</label>
        <input type="number" id="folgaColabId" value="1" required>
      </div>
      <div class="form-group">
        <label>Tempo da Folga (em Minutos - Ex: 15 para 15min, 60 para 1h):</label>
        <input type="number" id="folgaMinutos" placeholder="Ex: 15" required>
      </div>
      <button type="submit" class="btn-submit">Lançar Folga</button>
    </form>
  </div>

  <!-- NOVA ABA: VIAGEM -->
  <div id="viagem" class="tab-content">
    <h2>Lançamento de Viagem</h2>
    <form id="formViagem" enctype="multipart/form-data">
      <div class="form-group">
        <label>Colaborador ID:</label>
        <input type="number" id="viagemColabId" value="1" required>
      </div>
      <div class="form-group">
        <label>Data e Hora de Saída:</label>
        <input type="datetime-local" id="viagemSaida" required>
      </div>
      <div class="form-group">
        <label>Cliente / Destino:</label>
        <input type="text" id="viagemCliente" placeholder="Nome do cliente" required>
      </div>
      <div class="form-group">
        <label>Data e Hora de Chegada:</label>
        <input type="datetime-local" id="viagemChegada" required>
      </div>
      <div class="form-group">
        <label>Anexos / Imagens:</label>
        <input type="file" id="viagemAnexos" multiple accept="image/*">
      </div>
      <button type="submit" class="btn-submit">Registrar Viagem</button>
    </form>
  </div>

  <!-- ABA: HISTÓRICO (EXIBIÇÃO DE MINUTOS/HORAS CORRETA) -->
  <div id="historico" class="tab-content">
    <h2>Histórico do Colaborador / Gerente</h2>
    <button onclick="carregarHistorico()" style="margin-bottom: 10px; padding: 5px 10px;">Atualizar Histórico</button>

    <h3>Folgas Registradas</h3>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Tempo Concedido</th>
        </tr>
      </thead>
      <tbody id="tabelaFolgas"></tbody>
    </table>

    <h3>Atestados Registrados</h3>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Horas Abonadas</th>
        </tr>
      </thead>
      <tbody id="tabelaAtestados"></tbody>
    </table>

    <h3>Viagens Registradas</h3>
    <table>
      <thead>
        <tr>
          <th>Saída</th>
          <th>Cliente</th>
          <th>Chegada</th>
          <th>Horas Acumuladas</th>
          <th>Anexos</th>
        </tr>
      </thead>
      <tbody id="tabelaViagens"></tbody>
    </table>
  </div>

  <script>
    // Gerenciador de Abas
    function openTab(tabName) {
      const contents = document.querySelectorAll('.tab-content');
      const buttons = document.querySelectorAll('.tab-btn');
      contents.forEach(c => c.classList.remove('active'));
      buttons.forEach(b => b.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.currentTarget.classList.add('active');

      if(tabName === 'historico') carregarHistorico();
    }

    // Utilitário Frontend para Formatação de Minutos/Horas
    function formatarTempoJS(minutosTotais) {
      const sinal = minutosTotais < 0 ? "-" : "";
      const absMinutos = Math.abs(minutosTotais);
      const horas = Math.floor(absMinutos / 60);
      const mins = absMinutos % 60;

      if (horas === 0) return `${sinal}${mins} min`;
      if (mins === 0) return `${sinal}${horas}h`;
      return `${sinal}${horas}h ${mins}min`;
    }

    // Submit: Ponto
    document.getElementById('formPonto').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        colaboradorId: document.getElementById('pontoColabId').value,
        entrada: document.getElementById('pontoEntrada').value,
        inicioAlmoco: document.getElementById('pontoInicioAlmoco').value,
        fimAlmoco: document.getElementById('pontoFimAlmoco').value,
        Saida: document.getElementById('pontoSaida').value
      };
      const res = await fetch('/api/ponto/registrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(`Ponto Registrado! Saldo Atual: ${data.saldoTotalFormatado}`);
    };

    // Submit: Folga
    document.getElementById('formFolga').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        colaboradorId: document.getElementById('folgaColabId').value,
        minutosFolga: document.getElementById('folgaMinutos').value
      };
      const res = await fetch('/api/folga', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(`Folga Lançada! Saldo Atual: ${data.saldoAtual}`);
    };

    // Submit: Atestado
    document.getElementById('formAtestado').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        colaboradorId: document.getElementById('atestadoColabId').value,
        minutosAtestado: document.getElementById('atestadoMinutos').value
      };
      const res = await fetch('/api/atestado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(`Atestado Registrado! Saldo Atualizado: ${data.saldoAtual}`);
    };

    // Submit: Viagem
    document.getElementById('formViagem').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('colaboradorId', document.getElementById('viagemColabId').value);
      formData.append('dataHoraSaida', document.getElementById('viagemSaida').value);
      formData.append('cliente', document.getElementById('viagemCliente').value);
      formData.append('dataHoraChegada', document.getElementById('viagemChegada').value);

      const files = document.getElementById('viagemAnexos').files;
      for (let i = 0; i < files.length; i++) {
        formData.append('anexos', files[i]);
      }

      const res = await fetch('/api/viagem', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if(res.ok) {
        alert(`Viagem Lançada! ${data.viagem.duracaoFormatada} adicionados ao banco. Saldo Atual: ${data.saldoAtual}`);
      } else {
        alert(data.error);
      }
    };

    // Carregar e Renderizar Históricos
    async function carregarHistorico() {
      const res = await fetch('/api/historico');
      const data = await res.json();

      // Render Folgas
      const tbodyFolgas = document.getElementById('tabelaFolgas');
      tbodyFolgas.innerHTML = data.folgas.map(f => `
        <tr>
          <td>${new Date(f.data).toLocaleDateString()}</td>
          <td>${f.exibicaoTempo}</td>
        </tr>
      `).join('');

      // Render Atestados
      const tbodyAtestados = document.getElementById('tabelaAtestados');
      tbodyAtestados.innerHTML = data.atestados.map(a => `
        <tr>
          <td>${new Date(a.data).toLocaleDateString()}</td>
          <td>${a.exibicaoTempo}</td>
        </tr>
      `).join('');

      // Render Viagens
      const tbodyViagens = document.getElementById('tabelaViagens');
      tbodyViagens.innerHTML = data.viagens.map(v => `
        <tr>
          <td>${new Date(v.dataHoraSaida).toLocaleString()}</td>
          <td>${v.cliente}</td>
          <td>${new Date(v.dataHoraChegada).toLocaleString()}</td>
          <td>+${v.exibicaoTempo}</td>
          <td>${v.anexos.length} imagem(ns)</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
