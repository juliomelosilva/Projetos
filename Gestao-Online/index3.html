<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão & Cadastros</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #3498db;
      --success: #2ecc71;
      --danger: #e74c3c;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--primary);
      color: #fff;
      padding: 15px 20px;
      border-radius: 8px;
    }
    .btn-main {
      background: var(--secondary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-main:hover { opacity: 0.9; }
    
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      width: 90%;
      max-width: 850px;
      max-height: 85vh;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .btn-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }
    .tabs-header {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: #eee;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--secondary);
      color: #fff;
      border-color: var(--secondary);
    }
    .tabs-body {
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }
    .input-search {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
    }
    .card-item {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card-item h3 { margin-top: 0; color: var(--primary); }
    .card-item p { font-size: 14px; margin: 5px 0; }
    .card-item button {
      margin-top: 8px;
      margin-right: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #e3f2fd;
      color: #0d47a1;
      font-size: 12px;
      font-weight: bold;
    }
    .card-item button:hover { background: #bbdefb; }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
    }
    .badge-success { background: var(--success); }
    .badge-danger { background: var(--danger); }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>Painel do Sistema</h2>
    <button onclick="abrirMenuConsultas()" class="btn-main">🔍 Gestão de Cadastros</button>
  </div>

  <main>
    <p>Os serviços e operações continuam ativos normalmente nesta área.</p>
  </main>

  <!-- MODAL UNIFICADO DE GESTÃO -->
  <div id="modalConsultas" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Central de Consultas e Gestão</h2>
        <button onclick="fecharMenuConsultas()" class="btn-close">&times;</button>
      </div>

      <!-- ABAS -->
      <div class="tabs-header">
        <button class="tab-btn active" onclick="alternarAbaConsulta('colaboradores')">👥 Colaboradores</button>
        <button class="tab-btn" onclick="alternarAbaConsulta('veiculos')">🚗 Veículos</button>
        <button class="tab-btn" onclick="alternarAbaConsulta('equipes')">🛡️ Equipes Avançadas</button>
      </div>

      <div class="tabs-body">
        <!-- ABA 1: COLABORADORES -->
        <div id="abaColaboradores" class="tab-content">
          <input type="text" id="filtroColaborador" class="input-search" placeholder="Filtrar por nome..." oninput="renderizarColaboradores()">
          <div id="listaColaboradores" class="grid-cards"></div>
        </div>

        <!-- ABA 2: VEÍCULOS -->
        <div id="abaVeiculos" class="tab-content" style="display: none;">
          <input type="text" id="filtroVeiculo" class="input-search" placeholder="Filtrar por placa ou modelo..." oninput="renderizarVeiculos()">
          <div id="listaVeiculos" class="grid-cards"></div>
        </div>

        <!-- ABA 3: EQUIPES (AVANÇADO) -->
        <div id="abaEquipes" class="tab-content" style="display: none;">
          <div id="listaEquipes" class="grid-cards"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL do seu Apps Script implantado
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbx0mzNcMieUm_FyazeBKzq_jkvXCRqVB00CHe__JHaOeCNkaq4yhTfwcW1Xz1j-zRsHAQ/exec";

    // Trava de segurança para impedir sobrescrita de dados
    let dadosCarregadosDoServidor = false;

    // Estado global mantendo todas as estruturas intactas
    let dados = {
      colaboradores: [],
      veiculos: [],
      equipes: [],
      servicos: []
    };

    // --- COMUNICAÇÃO COM O SERVER ---

    async function carregarDadosDoServidor() {
      try {
        const response = await fetch(URL_SCRIPT, {
          method: 'POST',
          body: JSON.stringify({ action: 'load' })
        });
        const result = await response.json();

        if (result.ok && result.data) {
          // Garante a mesclagem dos dados remotos com a estrutura global
          dados = Object.assign({}, dados, result.data);
          dadosCarregadosDoServidor = true;
          console.log("Dados remotos carregados com sucesso.");
        }
      } catch (error) {
        console.error("Erro ao carregar dados remotos:", error);
      }
    }

    async function sincronizarComServidor() {
      // SEGURANÇA: Cancela a gravação se a leitura remota ainda não ocorreu
      if (!dadosCarregadosDoServidor) {
        alert("Aguarde o carregamento completo do banco de dados antes de realizar alterações.");
        return;
      }

      try {
        await fetch(URL_SCRIPT, {
          method: 'POST',
          body: JSON.stringify({
            action: 'sync',
            data: dados
          })
        });
        console.log("Sincronizado com sucesso.");
      } catch (error) {
        console.error("Erro ao sincronizar dados:", error);
      }
    }

    // --- CONTROLE DE NAVEGAÇÃO E MODAL ---

    function abrirMenuConsultas() {
      document.getElementById('modalConsultas').style.display = 'flex';
      alternarAbaConsulta('colaboradores');
    }

    function fecharMenuConsultas() {
      document.getElementById('modalConsultas').style.display = 'none';
    }

    function alternarAbaConsulta(aba) {
      document.getElementById('abaColaboradores').style.display = 'none';
      document.getElementById('abaVeiculos').style.display = 'none';
      document.getElementById('abaEquipes').style.display = 'none';

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      if (aba === 'colaboradores') {
        document.getElementById('abaColaboradores').style.display = 'block';
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        renderizarColaboradores();
      } else if (aba === 'veiculos') {
        document.getElementById('abaVeiculos').style.display = 'block';
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        renderizarVeiculos();
      } else if (aba === 'equipes') {
        document.getElementById('abaEquipes').style.display = 'block';
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        renderizarEquipes();
      }
    }

    // --- GESTÃO DE COLABORADORES ---

    function renderizarColaboradores() {
      const filtro = document.getElementById('filtroColaborador').value.toLowerCase();
      const container = document.getElementById('listaColaboradores');
      container.innerHTML = '';

      const filtrados = (dados.colaboradores || []).filter(c => c.nome.toLowerCase().includes(filtro));

      filtrados.forEach(colab => {
        const idxReal = dados.colaboradores.findIndex(c => c.id === colab.id || c.nome === colab.nome);

        container.innerHTML += `
          <div class="card-item">
            <h3>${colab.nome}</h3>
            <p><strong>Usuário:</strong> ${colab.usuario || '-'}</p>
            <p><strong>E-mail:</strong> ${colab.email || '-'}</p>
            <button onclick="editarColaborador(${idxReal})">✏️ Editar Dados</button>
          </div>
        `;
      });
    }

    function editarColaborador(index) {
      const colab = dados.colaboradores[index];

      const novoNome = prompt("Nome do Colaborador:", colab.nome);
      if (novoNome === null) return;

      const novoUsuario = prompt("Usuário de Acesso:", colab.usuario || '');
      if (novoUsuario === null) return;

      const novoEmail = prompt("E-mail:", colab.email || '');
      if (novoEmail === null) return;

      const novaSenha = prompt("Nova Senha (deixe em branco para manter a atual):");

      dados.colaboradores[index].nome = novoNome.trim();
      dados.colaboradores[index].usuario = novoUsuario.trim();
      dados.colaboradores[index].email = novoEmail.trim();
      
      if (novaSenha && novaSenha.trim() !== '') {
        dados.colaboradores[index].senha = novaSenha.trim();
      }

      renderizarColaboradores();
      sincronizarComServidor();
    }

    // --- GESTÃO DE VEÍCULOS ---

    function renderizarVeiculos() {
      const filtro = document.getElementById('filtroVeiculo').value.toLowerCase();
      const container = document.getElementById('listaVeiculos');
      container.innerHTML = '';

      const filtrados = (dados.veiculos || []).filter(v => 
        (v.modelo && v.modelo.toLowerCase().includes(filtro)) || 
        (v.placa && v.placa.toLowerCase().includes(filtro))
      );

      filtrados.forEach(veic => {
        const idxReal = dados.veiculos.findIndex(v => v.placa === veic.placa);
        const isDisponivel = veic.disponivel !== false;

        container.innerHTML += `
          <div class="card-item">
            <h3>${veic.modelo}</h3>
            <p><strong>Placa:</strong> ${veic.placa}</p>
            <p><strong>KM:</strong> ${veic.km || 0} km</p>
            <p>
              <strong>Status:</strong> 
              <span class="status-badge ${isDisponivel ? 'badge-success' : 'badge-danger'}">
                ${isDisponivel ? 'Disponível' : 'Indisponível / Uso'}
              </span>
            </p>
            <button onclick="editarVeiculo(${idxReal})">✏️ Editar Veículo</button>
          </div>
        `;
      });
    }

    function editarVeiculo(index) {
      const veic = dados.veiculos[index];

      const novoModelo = prompt("Modelo do Veículo:", veic.modelo);
      if (novoModelo === null) return;

      const novaPlaca = prompt("Placa:", veic.placa);
      if (novaPlaca === null) return;

      const novaKm = prompt("Quilometragem Atual:", veic.km || 0);
      if (novaKm === null) return;

      const statusDisp = confirm("Clique em OK para DISPONÍVEL ou CANCELAR para INDISPONÍVEL/EM USO.");

      dados.veiculos[index].modelo = novoModelo.trim();
      dados.veiculos[index].placa = novaPlaca.trim();
      dados.veiculos[index].km = parseFloat(novaKm) || 0;
      dados.veiculos[index].disponivel = statusDisp;

      renderizarVeiculos();
      sincronizarComServidor();
    }

    // --- GESTÃO AVANÇADA DE EQUIPES ---

    function renderizarEquipes() {
      const container = document.getElementById('listaEquipes');
      container.innerHTML = '';

      (dados.equipes || []).forEach((equipe, index) => {
        const membrosNomes = (equipe.membros || []).join(', ');

        container.innerHTML += `
          <div class="card-item">
            <h3>${equipe.nome}</h3>
            <p><strong>Integrantes:</strong> ${membrosNomes || 'Nenhum membro'}</p>
            <div>
              <button onclick="alterarNomeEquipe(${index})">✏️ Renomear</button>
              <button onclick="adicionarMembroEquipe(${index})">➕ Add Membro</button>
              <button onclick="removerMembroEquipe(${index})">➖ Rem Membro</button>
            </div>
          </div>
        `;
      });
    }

    function alterarNomeEquipe(index) {
      const novoNome = prompt("Novo nome da equipe:", dados.equipes[index].nome);
      if (novoNome && novoNome.trim() !== '') {
        dados.equipes[index].nome = novoNome.trim();
        renderizarEquipes();
        sincronizarComServidor();
      }
    }

    function adicionarMembroEquipe(indexEquipe) {
      const equipe = dados.equipes[indexEquipe];
      if (!equipe.membros) equipe.membros = [];

      const disponiveis = (dados.colaboradores || []).filter(c => !equipe.membros.includes(c.nome));

      if (disponiveis.length === 0) {
        alert("Todos os colaboradores cadastrados já estão nesta equipe.");
        return;
      }

      const opcoes = disponiveis.map((c, i) => `${i + 1}. ${c.nome}`).join('\n');
      const escolha = prompt(`Selecione o número do colaborador para adicionar:\n\n${opcoes}`);

      const idxEscolhido = parseInt(escolha) - 1;
      if (!isNaN(idxEscolhido) && disponiveis[idxEscolhido]) {
        equipe.membros.push(disponiveis[idxEscolhido].nome);
        renderizarEquipes();
        sincronizarComServidor();
      }
    }

    function removerMembroEquipe(indexEquipe) {
      const equipe = dados.equipes[indexEquipe];
      if (!equipe.membros || equipe.membros.length === 0) {
        alert("Esta equipe não possui membros para remover.");
        return;
      }

      const opcoes = equipe.membros.map((m, i) => `${i + 1}. ${m}`).join('\n');
      const escolha = prompt(`Selecione o número do membro para remover:\n\n${opcoes}`);

      const idxEscolhido = parseInt(escolha) - 1;
      if (!isNaN(idxEscolhido) && equipe.membros[idxEscolhido]) {
        equipe.membros.splice(idxEscolhido, 1);
        renderizarEquipes();
        sincronizarComServidor();
      }
    }

    // Inicialização ao carregar a página
    window.onload = () => {
      carregarDadosDoServidor();
    };
  </script>
</body>
</html>
